<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สมัครสมาชิก | ระบบแจ้งซ่อมภายในโรงเรียน</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

  <section class="login-panel">
    <div class="login-card">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px">
        <span class="logo-mark">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        </span>
        <b>ระบบแจ้งซ่อมโรงเรียน</b>
      </div>
      <h2>สมัครสมาชิก</h2>
      <p>สำหรับครู นักเรียน และบุคลากร ที่ต้องการแจ้งซ่อม<br>(บัญชีช่างซ่อม/ผู้ดูแลระบบ ติดต่อขอจากผู้ดูแลระบบ)</p>

      <div id="regError" class="login-error" hidden></div>

      <form id="regForm" autocomplete="off">
        <div class="field" style="margin-bottom:16px">
          <label for="rName">ชื่อ - สกุล *</label>
          <input class="input" type="text" id="rName" placeholder="เช่น ด.ญ.สมมี ขยันเรียน" required>
        </div>
        <div class="field" style="margin-bottom:16px">
          <label for="rUsername">ชื่อผู้ใช้ (ภาษาอังกฤษ ไม่มีวรรค) *</label>
          <input class="input" type="text" id="rUsername" placeholder="เช่น mimi2540" required minlength="4" pattern="[A-Za-z0-9_.]+" title="ใช้อังกฤษตัวเลข _ . เท่านั้น">
        </div>
        <div class="form-grid-2" style="margin-bottom:16px">
          <div class="field">
            <label for="rPassword">รหัสผ่าน *</label>
            <input class="input" type="password" id="rPassword" required minlength="4" placeholder="อย่างน้อย 4 ตัวอักษร">
          </div>
          <div class="field">
            <label for="rConfirm">ยืนยันรหัสผ่าน *</label>
            <input class="input" type="password" id="rConfirm" required placeholder="พิมพ์รหัสผ่านซ้ำ">
          </div>
        </div>
        <div class="field" style="margin-bottom:20px">
          <label for="rPhone">เบอร์ติดต่อ (ไม่บังคับ)</label>
          <input class="input" type="tel" id="rPhone" placeholder="เช่น 08x-xxx-xxxx">
        </div>
        <button class="btn btn-block" type="submit">สมัครสมาชิก</button>
      </form>

      <p class="reg-link">มีบัญชีอยู่แล้ว? <a href="index.html">เข้าสู่ระบบที่นี่</a></p>
    </div>
  </section>

  <script src="js/db.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
